# =============================================================================
#  docker/compose.linux.yml  --  ADD-ON to compose.sim.yml for a LINUX DESKTOP (instead of Windows + WSL2)
#
#  PURPOSE: shows the containers' windows (Gazebo, RViz, the demo panel) on a normal Linux desktop. The
#  desktop's X11 server listens on a socket in /tmp/.X11-unix; handing that folder and $DISPLAY to the
#  containers lets their windows appear on your screen. (Ubuntu's default Wayland desktop also runs an X11
#  server, "XWayland", for such programs, so this works there too.)
#  For 3D on the graphics card add ONE of these as well (simulation/docker/compose_up.sh picks them for you):
#    * docker/compose.dri.yml   Intel / AMD graphics (and NVIDIA cards that show /dev/dri/renderD128)
#    * docker/compose.gpu.yml   NVIDIA card + NVIDIA Container Toolkit (also gives CUDA to the detector)
#  Without either, Mesa draws on the processor ("llvmpipe"): everything works, only slower.
#  The X server must allow the containers in (once per login; compose_up.sh does it):
#      xhost +SI:localuser:$(id -un)
#  This only works when the images were built with YOUR user id (build_images.sh does that), because the X
#  server checks who connects.
#
#  HOW TO USE:
#      docker compose -f docker/compose.sim.yml -f docker/compose.linux.yml [-f docker/compose.dri.yml] \
#        [-f docker/compose.gpu.yml] up --no-build --abort-on-container-exit --exit-code-from sim
# =============================================================================

x-linux-env: &linux_env
  DISPLAY: ${DISPLAY:-:0}                 # your desktop's X11 display (echo $DISPLAY shows it, e.g. :0 or :1)
  XDG_RUNTIME_DIR: /tmp/runtime-ubuntu    # a private runtime folder for Qt inside the container
  QT_X11_NO_MITSHM: "1"                   # no X11 shared memory between the container and the X server

services:
  sim:
    environment: *linux_env
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
  jetson:
    environment: *linux_env
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix

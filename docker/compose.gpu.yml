# =============================================================================
#  docker/compose.gpu.yml  --  ADD-ON to compose.sim.yml: give both containers the NVIDIA card (CUDA + OpenGL)
#
#  PURPOSE: the team's detector (new_od: YOLO + SAHI with PyTorch) is about 10x faster on the graphics card than
#  on the processor. This file asks Docker for the NVIDIA card ("--gpus all") through the NVIDIA Container
#  Toolkit, which simulation/docker/install_docker_engine.sh installs when it sees an NVIDIA card. On a Linux PC
#  it also brings NVIDIA's OpenGL driver into the containers, so Gazebo and RViz draw on the card.
#  It is a separate file because Docker refuses to start a container that asks for a GPU on a PC without an
#  NVIDIA card or without the toolkit; compose_up.sh adds it only when `docker info` lists the "nvidia" runtime
#  (never with --no-gpu).
#  NVIDIA_DRIVER_CAPABILITIES=all = compute (CUDA) + utility (nvidia-smi) + graphics (OpenGL/Vulkan) + video.
#  Tested on Windows 11 / WSL2: with "all", Mesa still draws through d3d12 on the NVIDIA card (compose.wslg.yml),
#  so the same value works on Windows and Linux and the order of the -f files does not matter.
#  PyTorch only uses CUDA when the images were built with CUDA PyTorch: build_images.sh does that by default on a
#  PC with an NVIDIA card (--torch cuda).
#
#  HOW TO USE:  docker compose -f docker/compose.sim.yml [-f docker/compose.wslg.yml | -f docker/compose.linux.yml] \
#                 -f docker/compose.gpu.yml up ...
#  Check:       docker run --rm --gpus all ubuntu:22.04 nvidia-smi      (must list the card)
# =============================================================================

x-nvidia: &nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  sim:
    <<: *nvidia
    environment:
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
  jetson:
    <<: *nvidia
    environment:
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}

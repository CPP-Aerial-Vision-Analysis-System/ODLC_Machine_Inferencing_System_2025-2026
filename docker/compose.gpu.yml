# =============================================================================
#  docker/compose.gpu.yml  --  ADD-ON to compose.sim.yml: give both containers the NVIDIA card for CUDA
#
#  PURPOSE: the team's detector (new_od: YOLO + SAHI with PyTorch) is about 10x faster on the graphics card
#  than on the processor. This file asks Docker for the NVIDIA card ("--gpus all") through the NVIDIA
#  Container Toolkit, which simulation/docker/install_docker_engine.sh installs when it sees an NVIDIA card.
#  It is a separate file because Docker refuses to start a container that asks for a GPU on a PC without
#  NVIDIA card or toolkit; compose_up.sh adds it automatically only when `docker info` lists the "nvidia"
#  runtime (or never, with --no-gpu).
#  Note: drawing the 3D windows on Windows does NOT need this file (that goes through /dev/dxg + Mesa d3d12,
#  already in compose.sim.yml). PyTorch only uses CUDA when the images were built with CUDA PyTorch:
#  build_images.sh does that by default on a PC with an NVIDIA card (--torch cuda).
#
#  HOW TO USE:  docker compose -f docker/compose.sim.yml -f docker/compose.gpu.yml up
#               (Linux PC: put docker/compose.linux.yml AFTER this file, it widens the capabilities below)
#  Check:       docker run --rm --gpus all ubuntu:22.04 nvidia-smi      (must list the card)
# =============================================================================

services:
  sim:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # compute = CUDA, utility = nvidia-smi. compose.linux.yml widens it to "all" (drawing on Linux needs it).
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
  jetson:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

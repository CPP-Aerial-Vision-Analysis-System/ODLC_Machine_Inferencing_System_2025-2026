# lattice_bridge/setup.cfg -- PURPOSE: tells setuptools to install console scripts where `ros2 run` looks for
# them (lib/lattice_bridge), the standard layout of an ament_python package. Phase 1 has no console scripts
# yet; the section is here so phase 2 can add one without touching the layout.
[develop]
script_dir=$base/lib/lattice_bridge
[install]
install_scripts=$base/lib/lattice_bridge

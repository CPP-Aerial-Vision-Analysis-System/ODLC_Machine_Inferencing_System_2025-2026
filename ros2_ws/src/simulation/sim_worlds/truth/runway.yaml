# truth/runway.yaml -- PURPOSE: ground truth of the "runway" world: where the hiker (mannequin) and the tent
# REALLY are, plus the distractors (people, vehicles, debris, bushes), so a run can be scored automatically.
# NEVER give this file to the detector. GENERATED by sim_worlds/scripts/build_runway.py (seed 7) - edit that
# script and re-run it.

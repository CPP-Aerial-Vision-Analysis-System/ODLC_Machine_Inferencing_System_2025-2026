frame: 'Gazebo world frame, ENU: x = metres east of the origin, y = metres north, z = metres up; origin = centre of the take-off
  pad at ground level (= SITL home)'
latlon_convention: lat/lon = what ArduPilot SITL (and so /mavros/global_position/global and the photo names) reports directly
  above the point; lat_wgs84/lon_wgs84 = exact WGS84 (what a Gazebo NavSat sensor reports). They differ by about 1 m at most
  here.

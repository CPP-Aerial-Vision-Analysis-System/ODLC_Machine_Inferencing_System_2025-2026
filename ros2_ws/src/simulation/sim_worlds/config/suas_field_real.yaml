# config/suas_field_real.yaml -- PURPOSE: everything the bringup needs to start the "suas_field_real" world: which SDF
# to load, where SITL's home is (it MUST equal the world's <spherical_coordinates>), where the drone spawns,
# which survey mission to upload and where the ground-truth list of targets is.
# GENERATED by sim_worlds/realfield/world_build.py (scripts/build_real_field.py world) (seed 2026, assets fuel) - edit that
# script and re-run it instead of editing this file. All file paths are relative to the sim_worlds share
# folder:  $(ros2 pkg prefix --share sim_worlds)/<path>
world_name: suas_field_real                        # <world name="..."> inside the SDF (gz service names use it)
description: "SUAS 2026 field on REAL terrain (lidar + NAIP aerial photo): 2 search boundaries, each with one hiker and one tent"
world_file: worlds/suas_field_real.sdf
home: "36.2147411,-96.0067230,210.2,0"   # lat,lon,alt_msl_m,heading_deg -> SITL --home
spawn: {x: 0.000, y: 0.000, z: 0.250, yaw: 1.5708}   # drone start pose (m, rad, ENU); yaw 1.5708 = nose north
mission: missions/suas_field_real_survey.waypoints
truth: truth/suas_field_real.yaml
gui:                                       # what the world's GUI shows (worldgen/world.py)
  follow_target: iris                      # the bringup calls /gui/follow with this entity name
  follow_offset: [-12, 0, 6]          # m, in the drone frame (behind, left, up)
  camera_topic: /sim/camera/video/image   # shown in the "Drone camera (live)" panel
search_areas:                              # rectangles the drone must search (local metres, ENU)
  - name: search_boundary_1
    note: "one hiker + one tent among debris, vehicles, bushes and people (real terrain)"
    center: [237.129, -250.403]          # m
    size: [262.395, 147.038]          # m: [along the lanes, across the lanes]
    yaw: 0.0000                       # rad: lane direction (0 = east, 1.5708 = north)
  - name: search_boundary_2
    note: "one hiker + one tent among debris, vehicles, bushes and people (real terrain)"
    center: [293.368, -12.101]          # m
    size: [258.113, 148.452]          # m: [along the lanes, across the lanes]
    yaw: 1.5708                       # rad: lane direction (0 = east, 1.5708 = north)
survey:                                    # how the contract mission was made (scripts/make_mission.py re-reads this)
  area: search_boundary_1
  altitude_m: 58.7                    # survey height above home
  sidelap: 0.3                         # photo overlap between lanes
  frontlap: 0.6                        # photo overlap along a lane
  photo_interval_s: 2                 # one photo every N s (real pipeline)
  agl_basis_m: 46.7668                     # camera height over the HIGHEST ground: lanes and speed are planned for it
  speed_mps: null                      # null = automatic from frontlap; 0 = no DO_CHANGE_SPEED
  max_speed_mps: 10
  lead_in_s: 0                         # lane 1 starts this many s of flight early (team camera set-up after DigiCamCtrl)
  camera: {hfov_rad: 1.4137, width_px: 2560, height_px: 1440}
  planned:                                 # facts about the written mission
    altitude_m: 58.7
    lanes: 3
    lane_spacing_m: 33.58
    max_lane_spacing_m: 55.92
    footprint_m: [79.9, 44.9]
    gsd_cm_per_px: 3.12
    speed_mps: 8.5
    survey_path_m: 854.3
    total_path_m: 1575.9
    items: 12
    digicam_index: 3
    buffer_wp: 9
    hold_wp: 10
    rtl_index: 11
    lane_yaw_deg: 0.0
    file: "missions/suas_field_real_survey.waypoints"
extra_missions:                            # more missions for other search areas
  - area: search_boundary_2
    file: missions/suas_field_real_sb2_survey.waypoints
    altitude_m: 55.8
    lanes: 3
    speed_mps: 8.5

  steps:
    - title: The world and the autopilot lock together
      wires: [physics, serial0]
      boxes: [gazebo, sitl, proxy]
      text: >-
        sim.launch.py starts Gazebo and ArduPilot SITL. They trade one physics step at a time over UDP 9002: SITL sends
        the motor outputs, Gazebo answers with position, speed, attitude and IMU readings. Neither can run ahead of the
        other. SITL then waits for MAVProxy on its main port, TCP 5760.
    - title: MAVProxy copies the radio link to the ground
      wires: [serial0, mp_link, tool_link, recorder_link, lattice_link]
      boxes: [proxy, sitl, mp, tool, recorder, lbridge]
      text: >-
        MAVProxy is the twin of the telemetry radio. It copies SITL's main link to UDP ports: 14550 for the demo scripts
        and for Mission Planner on Windows, 14555 for the CSV flight recorder (demo.sh adds it). The Lattice bridge
        (handed to the team, optional) gets its copy on UDP 14554 from a second MAVProxy.
    - title: The Jetson's software plugs into its own port
      wires: [serial2, s_mavros, s_main, s_wpm, s_gps, s_trigger, s_newod]
      boxes: [sitl, mavros, rail, main, wpm, gps, trigger, newod]
      text: >-
        ./launcher.sh sim starts MAVROS on TCP 5763, SITL's SERIAL2: the real Jetson is wired the same way, with a
        serial cable to the Pixhawk's TELEM2 port. Then tracker.launch.xml starts the team's nodes, which still include
        last year's photo nodes (grey).
    - title: Upload, arm, take off
      wires: [tool_link, serial0, physics, serial2, s_mavros, s_wpm]
      boxes: [tool, proxy, sitl, gazebo, mavros, rail, wpm]
      text: >-
        mission_tool (run by demo.sh) waits for GPS, the EKF and the pre-arm checks, uploads the survey mission, arms
        and switches to AUTO, all through MAVProxy. waypoint_manager reads the same mission through MAVROS
        (/mavros/mission/pull) and works out the indices it needs. SITL spins the motors and Gazebo lifts the drone.
    - title: The camera streams video (new pipeline, being built in the twin)
      wires: [gz_video, rtsp, image_raw, zr10_sdk]
      boxes: [gazebo, emu, zr10stream, detector, zr10node]
      text: >-
        The field system: the team's zr10_stream pulls the ZR10's live video over RTSP (TCP 8554, /main.264) and
        publishes 2 pictures a second on /zr10/image_raw; the detection package subscribes to it. zr10_node can steer
        the camera with SIYI SDK commands (UDP 37260). In the twin the simulated ZR10 makes the stream from the Gazebo
        gimbal camera; that part is being built.
    - title: The detector looks at every picture
      wires: [image_raw, det_files, det_adapter]
      boxes: [detector, detfiles, adapter]
      text: >-
        Today the team's detector writes one CSV file and one annotated picture per frame, and publishes no topic. Our
        proposal (dotted, not adopted by the team) makes it also publish its boxes on a topic.
    - title: Detections reach the mission brain (team decision still open)
      wires: [adapter_main, adapter_sdk, s_adapter, legacy_trigger, legacy_sdk, legacy_http, legacy_folder, legacy_newod, s_newod, s_main]
      boxes: [adapter, main, emu, rail, trigger, siyi, folder, newod]
      text: >-
        How detections reach main_controller is not decided by the team. Our proposal's adapter turns each box into a
        ground position (drone pose + gimbal angles at the picture's time) and publishes /image_detection, which
        main_controller already reads. Today's default demo still feeds it from last year's photo pipeline (grey):
        photo trigger, siyi, the photo folder, new_od.
    - title: Hold, then add target waypoints
      wires: [s_main, s_wpm, s_mavros, serial2, serial0, mp_link]
      boxes: [main, wpm, mavros, rail, sitl, proxy, mp]
      text: >-
        At the hold point main_controller switches to GUIDED and waits for the detector (at most 90 s). Then it calls
        /addWaypoint; waypoint_manager inserts the targets and pushes the whole list. main_controller goes back to AUTO.
        Its texts ("Aim tent ...", "Targets: ...") travel through SERIAL2, SITL and MAVProxy to Mission Planner.
    - title: Drop
      wires: [s_main, s_mavros, serial2, physics, payload_gz, serial0, mp_link]
      boxes: [main, mavros, rail, sitl, gazebo, payload, proxy, mp]
      text: >-
        Over the tent main_controller sends DO_SET_SERVO (command 183): channel 13 to 1400 microseconds. SITL sets
        output 13, ArduPilotPlugin copies it into Gazebo, payload_release unhooks the box and it falls. The text "Servo
        13 -> 1400" puts a drop marker on Mission Planner's map. The hiker's payload uses channel 11 the same way.
    - title: Watch it in Mission Planner
      wires: [gz_bridge, bridge_pov, pov_mp, mp_link]
      boxes: [gazebo, gzbridge, pov, mp, proxy]
      text: >-
        All flight long, Gazebo's live camera goes through ros_gz_bridge (/sim/camera/image) to pov_server, which serves
        it as MJPEG on port 8081 with the gimbal angles drawn on it. The ASTRA plugin paints it into the HUD and turns
        the status texts into the phase strip, the hiker and tent cards and the map markers.
    - title: Record, score and look at the logs
      wires: [recorder_link, recorder_files, s_referees, referees_files]
      boxes: [proxy, recorder, runfolder, referees, rail]
      text: >-
        The flight recorder writes the CSV files live from its own MAVLink copy (UDP 14555). The referees only listen to
        ROS 2 and write the phases and, after the landing, the score report. At the end the run summary lists what ran
        and every problem. bash simulation/scripts/logs.sh shows it all.
    - title: Jetson in the loop (being built)
      wires: [mavros_relay, relay_mav, relay_cam, tap]
      boxes: [mavros, relay, sitl, emu, referees]
      text: >-
        For a Jetson-in-the-loop flight the team's software runs in the astra-hil container. MAVROS talks to
        127.0.0.1:5763 inside it; the relay carries the MAVLink to SITL SERIAL2, the camera traffic (SDK, RTSP, HTTP) to
        the simulated camera, and a read-only copy of the team's topics back to the referees. Only the virtual Jetson
        on this PC is used for now; the real Jetson uses the owner's SSH login later.
    - title: Watch the code run
      wires: [tracer, page]
      boxes: [tracers, cmserver, browser]
      text: >-
        With bash simulation/scripts/demo_traced.sh, every traced program counts the calls of our functions and sends
        them to server.py on UDP 8091. This page (port 8090) lights up the boxes whose code is running.
